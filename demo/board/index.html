<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        font-src 'self' https://cdn.jsdelivr.net;
        img-src 'self' data: blob:;
        connect-src 'self' data: http://127.0.0.1:* http://localhost:* https: wss:;
        worker-src 'self' blob:;
        child-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212529">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <title>Sovereign Board - Decentralized Kanban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; }
        .kanban-board { display: flex; overflow-x: auto; padding: 20px; gap: 20px; height: calc(100vh - 120px); }
        .kanban-column { min-width: 300px; width: 300px; background: #ebedf0; border-radius: 8px; display: flex; flex-direction: column; max-height: 100%; }
        .kanban-column-header { padding: 12px 16px; font-weight: bold; color: #172b4d; display: flex; justify-content: space-between; align-items: center; }
        .kanban-tasks { flex: 1; overflow-y: auto; padding: 8px; }
        .kanban-task { background: white; padding: 12px; border-radius: 4px; box-shadow: 0 1px 0 rgba(9,30,66,.25); margin-bottom: 8px; cursor: pointer; transition: background 0.1s; position: relative; }
        .kanban-task:hover { background: #f4f5f7; }
        .kanban-task-title { font-weight: 500; margin-bottom: 4px; }
        .kanban-task-meta { font-size: 0.75rem; color: #5e6c84; display: flex; align-items: center; gap: 8px; }
        .kanban-task-avatar { width: 20px; height: 20px; border-radius: 50%; background: #dfe1e6; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .add-task-btn { width: 100%; padding: 8px; text-align: left; color: #5e6c84; background: transparent; border: none; border-radius: 4px; }
        .add-task-btn:hover { background: rgba(9,30,66,.08); color: #172b4d; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; }
        .sync-indicator { font-size: 0.8rem; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .priority-high { border-left: 4px solid #ef5350; }
        .priority-medium { border-left: 4px solid #ffca28; }
        .priority-low { border-left: 4px solid #66bb6a; }
        .task-dragging { opacity: 0.5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script>
        window.SQL_CONFIG = {
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        };
    </script>
</head>
<body>
    <div id="root"></div>
    <!-- Polyfills and Scripts will be injected by build -->
    <script src="bundle.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .catch((err) => console.warn('Board SW registration failed:', err));
            });
        }
    </script>
</body>
</html>

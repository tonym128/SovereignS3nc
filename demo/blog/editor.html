<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        font-src 'self' https://cdn.jsdelivr.net;
        img-src 'self' data: blob:;
        connect-src 'self' http://127.0.0.1:* http://localhost:* https: wss:;
        worker-src 'self' blob:;
        child-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Blog - Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; min-height: 100vh; }
        .editor-container { max-width: 800px; margin: 2rem auto; }
        .editor-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .post-input-title { font-size: 2.5rem; font-weight: 700; border: none; border-bottom: 2px solid #eee; width: 100%; margin-bottom: 2rem; outline: none; }
        .post-input-title:focus { border-color: #0d6efd; }
        .post-input-content { font-size: 1.2rem; border: none; width: 100%; min-height: 400px; outline: none; resize: none; line-height: 1.6; }
        .navbar { background-color: #fff; border-bottom: 1px solid #eee; }
        .navbar-brand { font-weight: 800; }
        .image-preview { max-width: 100%; border-radius: 8px; margin-top: 1rem; }
        .markdown-preview { font-family: 'Georgia', serif; line-height: 1.6; }
        .markdown-preview img { max-width: 100%; border-radius: 4px; }
        .max-width-800 { max-width: 800px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script>
        window.SQL_CONFIG = {
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script src="editor-bundle.js"></script>
</body>
</html>

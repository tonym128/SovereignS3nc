# --- Garage Configuration for Local Testing ---

# Where Garage stores its internal metadata (SQLite DB)
metadata_dir = "/var/lib/garage/meta"

# Where Garage stores the actual data chunks
data_dir = "/var/lib/garage/data"

# For a single local node, we set replication to 1
replication_factor = 1
s3_region = "garage"

# Internal RPC communication (used for clustering)
rpc_bind_addr = "[::1]:3901"
rpc_secret = "e7b38c7e14f04d3d8118d82569c3ea706332dcb5d7f93b3cf080e1328dd64b11"

[s3_api]
# The port where the S3 API will be available
api_bind_addr = "0.0.0.0:3900"
s3_region = "garage"
# Set this if you want to use virtual-host style (e.g. bucket.localhost)
# Otherwise, path-style access (localhost:3900/bucket) is used by default.
root_domain = ".s3.garage"

[s3_web]
# Optional: used if you want to serve static websites from buckets
bind_addr = "0.0.0.0:3902"
root_domain = ".web.garage"

[admin]
# Optional: internal admin API port